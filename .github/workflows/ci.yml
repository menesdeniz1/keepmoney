name: CI

on: [push, pull_request]

env:
  KEEPMONEY_ORTAM: test
  # Yalnızca CI için üretilmiş CSPRNG çıktısı (>= 256 bit, ayarlar.py doğruluyor).
  # Üretim anahtarı GitHub Secrets'ta durur, iş akışı dosyasında değil.
  KEEPMONEY_JWT_GIZLI_ANAHTAR: nR4tK8vB2xW6zQ1yM9jH3sL7pD5gF0aC-eU2iO7kN4qT

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Testler
        run: pytest -q

      # Model ile migrasyonlar uyuşuyor mu? Kolon ekleyip migrasyon üretmeyi
      # unutmak, üretimde sessizce eski şemayla çalışmak demektir.
      - name: Şema/migrasyon uyumu
        run: |
          alembic upgrade head
          alembic check

      # Bilinen açığı olan bağımlılık kalmasın. Sessiz kalması "güvenli"
      # demek değildir ama gürültü çıkarması kesinlikle bakılması gerektiği
      # anlamına gelir.
      - name: Bağımlılık açık taraması
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off

  # WINDOWS. Geliştirme burada da yapılıyor ve platform farkları SESSİZDİR:
  # Windows'ta sistem saat dilimi veritabanı YOKTUR, bu yüzden `tzdata` paketi
  # eksikken uygulama import zincirinin en altında (zaman.py) patlıyor ve HİÇ
  # açılmıyordu. Ubuntu'da 437 test yeşilken Windows'ta tek bir komut bile
  # çalışmıyordu — bunu ancak Windows'ta koşan bir iş yakalar.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testler (Windows)
        run: pytest -q
      # Tanı aracı da açılabilmeli: betikler pakete dahil değil, import
      # yolları farklı ve sessizce çürüyorlar.
      - name: Tanı aracı açılıyor mu
        run: python betikler/kaynak_dene.py --help

  # ÜRETİM VERİTABANI POSTGRES. "SQLite'ta geçiyor" ile "Postgres'te
  # çalışıyor" aynı şey değil ve aradaki farklar sessizdir: tarih/saat
  # tipleri, boolean dönüşümü, `CASE`/`GREATEST` gibi ifade farkları,
  # kilitleme davranışı. Aynı paket gerçek Postgres'e karşı da koşuyor.
  postgres:
    runs-on: ubuntu-latest
    services:
      veritabani:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keepmoney
          POSTGRES_PASSWORD: keepmoney
          POSTGRES_DB: keepmoney
          # Açıkça UTF-8: SQL_ASCII bir veritabanı psycopg'ye metin yerine
          # bytes döndürür ve sürücü katmanı patlar. Türkçe bir üründe
          # kodlamayı varsayılana bırakmak ayrıca kabul edilemez.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keepmoney"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_URL: postgresql+psycopg://keepmoney:keepmoney@127.0.0.1:5432/keepmoney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt "psycopg[binary]>=3.2"

      - name: Göçler (Postgres)
        run: alembic upgrade head && alembic check
        env:
          KEEPMONEY_VERITABANI_URL: ${{ env.PG_URL }}

      - name: Göç geri alınabiliyor mu
        run: alembic downgrade base && alembic upgrade head
        env:
          KEEPMONEY_VERITABANI_URL: ${{ env.PG_URL }}

      - name: Testler (Postgres)
        run: pytest -q
        env:
          KEEPMONEY_TEST_VERITABANI_URL: ${{ env.PG_URL }}

  # Playwright yolu (JS ile fiyat yükleyen siteler — `render: true`) uzun
  # süre bir kez bile çalıştırılmamıştı: paket isteğe bağlı olduğu için
  # normal test koşusunda atlanıyordu. Gerçek tarayıcıyla, yerelde çalışan
  # gerçek bir HTTP sunucusuna karşı koşuyor. Dış ağa çıkmaz.
  tarayici-motoru:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: playwright install --with-deps chromium
      - name: Playwright entegrasyon testleri
        run: pytest -q tests/test_playwright.py
        env:
          # Boş bırakılınca Playwright kendi indirdiği tarayıcıyı bulur.
          KEEPMONEY_PLAYWRIGHT_CALISTIRILABILIR: ""

  # UÇTAN UCA: gerçek tarayıcı, gerçek sunucu, derlenmiş arayüz aynı
  # kaynaktan sunuluyor — üretimdeki biçimin aynısı. "JSX'te düğme var"
  # ile "düğme çalışıyor" arasındaki farkı kapatan tek iş bu.
  uctan-uca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: arayuz/package-lock.json
      - name: Arayüzü derle
        working-directory: arayuz
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: playwright install --with-deps chromium
      - name: Uçtan uca akışlar
        run: pytest -q tests/test_e2e_arayuz.py
        env:
          KEEPMONEY_PLAYWRIGHT_CALISTIRILABILIR: ""

  arayuz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arayuz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: arayuz/package-lock.json
      - run: npm ci
      # Backend'de ruff CI'da koşuyordu ama arayüz denetimsizdi: `lint`
      # betiği vardı, yapılandırması yoktu ve kimse çağırmadığı için
      # kırık olduğu fark edilmemişti.
      - name: Lint
        run: npm run lint
      - name: Tip kontrolü
        run: npx tsc -b
      - name: Testler
        run: npx vitest run
      - name: Derleme
        run: npm run build
