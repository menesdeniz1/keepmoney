# Üç süreç, tek imaj. Ayrı süreçler çünkü sorumlulukları ve arıza modları farklı:
# API düşerse tarama sürmeli; tarama tıkanırsa site açık kalmalı.
services:
  veritabani:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keepmoney
      POSTGRES_USER: keepmoney
      POSTGRES_PASSWORD: ${POSTGRES_PAROLA:?POSTGRES_PAROLA gerekli}
      # Kodlama AÇIKÇA belirtilir. SQL_ASCII bir veritabanı psycopg'ye metin
      # yerine bytes döndürür ve SQLAlchemy sürücü katmanı açılışta patlar;
      # üstelik Türkçe karakterler sessizce bozulur. Varsayılana güvenmek
      # ucuz görünür, hata ayıklaması pahalıdır.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes: [veri:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepmoney"]
      interval: 10s
      retries: 5
    # Veritabanı da yeniden başlamalı. Politikası YOKTU: makine yeniden
    # başladığında ya da postgres çökünce diğer üç servis `unless-stopped`
    # ile geri gelir, veritabanı gelmez — hepsi bağlanamayan servislere
    # dönerdi. `/saglik` artık bu durumda 503 döndüğü için sessiz de
    # kalmazdı, ama düzelmesi elle müdahale isterdi.
    restart: unless-stopped

  gocler:
    build: .
    command: alembic upgrade head
    environment: &ortak
      KEEPMONEY_ORTAM: uretim
      KEEPMONEY_VERITABANI_URL: postgresql+psycopg://keepmoney:${POSTGRES_PAROLA:?POSTGRES_PAROLA gerekli}@veritabani/keepmoney
      KEEPMONEY_JWT_GIZLI_ANAHTAR: ${KEEPMONEY_JWT_GIZLI_ANAHTAR:?en az 32 bayt CSPRNG çıktısı}
      KEEPMONEY_CORS_KAYNAKLARI: ${KEEPMONEY_CORS_KAYNAKLARI:-https://keepmoney.com}
      KEEPMONEY_TELEGRAM_BOT_TOKEN: ${KEEPMONEY_TELEGRAM_BOT_TOKEN:-}
      # E-posta olmadan parola sıfırlama SESSİZCE çalışmaz.
      KEEPMONEY_SMTP_SUNUCU: ${KEEPMONEY_SMTP_SUNUCU:-}
      KEEPMONEY_SMTP_PORT: ${KEEPMONEY_SMTP_PORT:-587}
      KEEPMONEY_SMTP_KULLANICI: ${KEEPMONEY_SMTP_KULLANICI:-}
      KEEPMONEY_SMTP_PAROLA: ${KEEPMONEY_SMTP_PAROLA:-}
      KEEPMONEY_EPOSTA_GONDEREN: ${KEEPMONEY_EPOSTA_GONDEREN:-KeepMoney <noreply@keepmoney.com>}
      KEEPMONEY_SITE_ADRESI: ${KEEPMONEY_SITE_ADRESI:-https://keepmoney.com}
      # Ters vekilin ağı. BOŞ BIRAKILIRSA `X-Forwarded-For` YOK SAYILIR ve
      # tüm istekler vekilin IP'sinden geliyormuş gibi görünür. Başlığa
      # koşulsuz güvenmek ise hız sınırını tamamen etkisiz kılıyordu
      # (ölçüldü) — bu yüzden güvenilecek kaynak AÇIKÇA yazılır.
      # Varsayılan, Docker'ın kendi köprü ağ aralığı: `vekil` konteyneri
      # oradan bağlanıyor. BOŞ bırakılsaydı `X-Forwarded-For` yok sayılır
      # ve tüm istekler vekilin IP'sinden geliyormuş gibi görünürdü — hız
      # sınırı çalışır ama yanlış anahtarla sayardı.
      KEEPMONEY_GUVENILEN_VEKILLER: ${KEEPMONEY_GUVENILEN_VEKILLER:-172.16.0.0/12}
      # /metrics kimliksiz açıktı. Token yoksa üretimde uç KAPALI (404).
      KEEPMONEY_METRIK_TOKENI: ${KEEPMONEY_METRIK_TOKENI:-}
    depends_on:
      veritabani: {condition: service_healthy}
    restart: "no"          # tek seferlik iş

  api:
    build: .
    environment: *ortak
    # HOST'A PORT AÇILMIYOR. Uygulama düz HTTP konuşuyor ve hız sınırı ters
    # vekil arkasında olmayı varsayıyor; host'a açılan her port o iki
    # varsayımı da atlatılabilir kılar. Dışarıya çıkan tek kapı `vekil`.
    # Aynı Docker ağındaki servisler `api:8000` ile erişir.
    expose: ["8000"]
    depends_on:
      gocler: {condition: service_completed_successfully}
    restart: unless-stopped

  # ── TLS + ters vekil ────────────────────────────────────────────
  #
  # ZORUNLU BİR PARÇA, "isteğe bağlı ek" DEĞİL. Uygulama üç şeyi vekile
  # devrediyor ve vekilsiz üçü de eksik kalıyor:
  #   • TLS sonlandırma (uygulama düz HTTP konuşur),
  #   • gerçek istemci IP'si (hız sınırı buna göre sayar),
  #   • dışarıya açılan tek kapı olmak.
  #
  # Caddy seçildi: sertifikayı Let's Encrypt'ten KENDİ alır ve yeniler.
  # nginx ile aynı işi kurmak ayrıca certbot + yenileme işi demek — ve
  # unutulan bir yenileme, sitenin bir sabah aniden kapanması demektir.
  #
  # KEEPMONEY_ALAN_ADI zorunlu: Caddy sertifikayı bu ada göre alır.
  # Yerel denemede `localhost` yazılırsa Caddy kendi imzaladığı sertifikayı
  # kullanır (tarayıcı uyarır, akış çalışır).
  vekil:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      KEEPMONEY_ALAN_ADI: "${KEEPMONEY_ALAN_ADI:?alan adi gerekli - yerel deneme icin localhost yaz}"
    volumes:
      - ./dagitim/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikalar KALICI olmalı: her yeniden başlatmada yeniden almak
      # Let's Encrypt hız sınırına takılır ve site sertifikasız kalır.
      - caddy_veri:/data
      - caddy_yapilandirma:/config
    depends_on: [api]
    restart: unless-stopped

  # Tarama worker'ı — API'den AYRI süreç. Playwright bellek yiyor ve uzun
  # süren okumalar web isteklerini bekletmemeli.
  tarayici:
    build: .
    command: python -m keepmoney.zamanlayici
    environment: *ortak
    # Kendi ölçüm ucu. AYRI süreç = AYRI prometheus kayıt defteri: tarama
    # sayaçları API'nin /metrics'inde GÖRÜNMEZ. Prometheus iki hedefi de
    # ayrı ayrı toplamalı — api:8000/metrics ve tarayici:9100/metrics.
    # Ölçüm ucu da yalnızca localhost: Prometheus ya aynı makinede ya da
    # vekil arkasında toplar. Dışarı açık bir ölçüm ucu, saldırganın keşif
    # işini bizim yapmamızdır.
    ports: ["127.0.0.1:9100:9100"]
    depends_on:
      gocler: {condition: service_completed_successfully}
    restart: unless-stopped

  bot:
    build: .
    command: python -m keepmoney.bot
    environment: *ortak
    depends_on:
      gocler: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  veri:
  caddy_veri:
  caddy_yapilandirma:
