domain: "amazon.com.tr"
satici: "Amazon"
render: false
# Ana fiyat bloğuna sınırlı: sayfadaki "diğer satıcılar" ve önerilen ürün
# fiyatlarını yakalamasın diye geniş "span.a-price" bilerek kullanılmıyor.
#
# Amazon düzeni A/B test ediyor: `corePriceDisplay_desktop_feature_div` sayfada
# DURUYOR ama boş kalabiliyor, fiyat `corePrice_desktop` kabuğuna taşınıyor.
# Gerçek bir sayfada tam da bu görüldü — listede `corePrice_feature_div` vardı,
# sayfadaki id ise `corePrice_desktop`'tı ve hiçbir seçici tutmadı.
# Sıra önemli: en dar kapsayıcı önce, `apex_desktop` en sonda (o geniş).
fiyat_secici: "#corePriceDisplay_desktop_feature_div span.a-price .a-offscreen, #corePrice_desktop span.a-price .a-offscreen, #corePrice_feature_div span.a-price .a-offscreen, #apex_desktop span.a-price .a-offscreen"
# Regex son çaresi SADECE ana ürün kolonuna baksın (sponsorlu karusel hariç)
metin_alani: "#centerCol"
notlar: "Bot koruması agresif; sık engel görülürse toplayıcı kaynağa yönlendir."
