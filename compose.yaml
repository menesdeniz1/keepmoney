# Üç süreç, tek imaj. Ayrı süreçler çünkü sorumlulukları ve arıza modları farklı:
# API düşerse tarama sürmeli; tarama tıkanırsa site açık kalmalı.
services:
  veritabani:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keepmoney
      POSTGRES_USER: keepmoney
      POSTGRES_PASSWORD: ${POSTGRES_PAROLA:?POSTGRES_PAROLA gerekli}
    volumes: [veri:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepmoney"]
      interval: 10s
      retries: 5

  gocler:
    build: .
    command: alembic upgrade head
    environment: &ortak
      KEEPMONEY_ORTAM: uretim
      KEEPMONEY_VERITABANI_URL: postgresql+psycopg://keepmoney:${POSTGRES_PAROLA}@veritabani/keepmoney
      KEEPMONEY_JWT_GIZLI_ANAHTAR: ${KEEPMONEY_JWT_GIZLI_ANAHTAR:?en az 32 bayt CSPRNG çıktısı}
      KEEPMONEY_CORS_KAYNAKLARI: ${KEEPMONEY_CORS_KAYNAKLARI:-https://keepmoney.com}
      KEEPMONEY_TELEGRAM_BOT_TOKEN: ${KEEPMONEY_TELEGRAM_BOT_TOKEN:-}
    depends_on:
      veritabani: {condition: service_healthy}
    restart: "no"          # tek seferlik iş

  api:
    build: .
    environment: *ortak
    ports: ["8000:8000"]
    depends_on:
      gocler: {condition: service_completed_successfully}
    restart: unless-stopped

  # Tarama worker'ı — API'den AYRI süreç. Playwright bellek yiyor ve uzun
  # süren okumalar web isteklerini bekletmemeli.
  tarayici:
    build: .
    command: python -m keepmoney.zamanlayici
    environment: *ortak
    depends_on:
      gocler: {condition: service_completed_successfully}
    restart: unless-stopped

  bot:
    build: .
    command: python -m keepmoney.bot
    environment: *ortak
    depends_on:
      gocler: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  veri:
